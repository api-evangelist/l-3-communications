aid: l-3-communications
name: L-3 Communications
description: >-
  L-3 Communications was a U.S. defense prime contractor specializing in
  command, control, communications, intelligence, surveillance and
  reconnaissance (C3ISR) systems, aircraft modernization and maintenance,
  and government services. In 2019 L-3 merged with Harris Corporation to
  form L3Harris Technologies, which continues the legacy product lines and
  is now ranked among the top U.S. defense contractors. No public developer
  API has been documented.
